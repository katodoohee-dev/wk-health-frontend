name: WK Health CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm install

      # The repository does not currently include eslint in devDependencies,
      # so CI validates the same production build used by Render instead of
      # failing on a missing lint executable.
      - name: Production build
        run: npm run build
