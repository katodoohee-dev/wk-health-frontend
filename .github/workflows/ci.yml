name: WK Health CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  round-1-build:
    name: Round 1 - Build Typecheck Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Normalize lockfile and install
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
      - name: Build production bundle
        run: npm run build
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint

  round-2-contracts:
    name: Round 2 - API and route contracts
    needs: round-1-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Normalize lockfile and install frontend
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
      - name: Verify production contracts
        run: npm run test:production
      - name: Verify backend runtime contracts
        run: npm run test:backend

  round-3-hardening:
    name: Round 3 - Production hardening
    needs: round-2-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check repository hygiene
        shell: bash
        run: |
          set -euo pipefail

          if find . -maxdepth 3 -type f \( -name '.env' -o -name '.env.local' \) -print | grep -q .; then
            echo 'Tracked environment file found'
            exit 1
          fi

          if grep -R "AIza[0-9A-Za-z_-]\{20,\}" -n src scripts 2>/dev/null; then
            echo 'Possible hard-coded Google API key found'
            exit 1
          fi

          if grep -R "apigemini\.katodoohee\.workers\.dev" -n src 2>/dev/null; then
            echo 'Gemini proxy must come from environment, not frontend code'
            exit 1
          fi

          if grep -R "localhost:\|127\.0\.0\.1" -n src 2>/dev/null; then
            echo 'Production frontend contains localhost/loopback URL'
            exit 1
          fi

          test -f render.yaml
          test -f .env.example || true
          echo 'Production hardening checks passed'
