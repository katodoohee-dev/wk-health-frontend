services:
  - type: web
    name: wk-health-backend
    runtime: node
    plan: starter
    branch: main
    rootDir: backend
    autoDeploy: true
    buildCommand: npm install --include=dev
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: wk-health-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DB_PATH
        value: /var/data/wk-health.db
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_API_URL
        value: https://api.deepseek.com/chat/completions
      - key: DEEPSEEK_MODEL
        value: deepseek-chat

  - type: web
    name: wk-health-frontend
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm install && npm run build && npm run test:production
    startCommand: node render-server.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      # Browser API calls use the same backend URL as the original deployment.
      # Keep BACKEND_URL for the server-side proxy/health check as a fallback.
      - key: BACKEND_URL
        fromService:
          type: web
          name: wk-health-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: wk-health-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_API_URL
        fromService:
          type: web
          name: wk-health-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: wk-health-backend
          envVarKey: RENDER_EXTERNAL_URL
