services:
  - type: web
    name: wk-health-frontend
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_API_BASE_URL
        value: https://wk-health-backend.onrender.com
